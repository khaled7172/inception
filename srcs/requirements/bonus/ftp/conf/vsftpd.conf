listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
chroot_local_user=YES
allow_writeable_chroot=YES
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
# If you connect from OUTSIDE the VM (not just from the host via port-forward),
# uncomment and set this to your VM's real reachable IP, or passive mode breaks:
# pasv_address=YOUR_VM_IP
